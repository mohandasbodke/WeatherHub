<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WeatherHub</title>
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="stylesheet" href="first.css">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="heading">
<div class="img">
<img src="img/icon.png">
<h1> Weather APP</h1>
</div>
<h3>get real-time Weather Updates</h3>
</div>
<div class="first">
<div class="input">

<input type="text" placeholder="  Enter city name..">
</div>
<div class="search">
<button><i class="fa-solid fa-magnifying-glass"></i> Search</button>
</div>
</div>


<div class="second">
<div class="one">
<div class="city">City </div>
<div class="address">
<div class="iconAdd"><i class="fa-solid fa-location-dot"></i></div>
<div class="addressCity">Address </div>

</div>

<div class="temprature">
<div class="tem">00</div>
<div class="sub"><sup>o</sup><sup>C</sup></div>
</div>
<div class="description">description</div>
<div class="feel">
<div class="feels_like">Feels like:</div>
<div class="feelDeg">00</div>
<div class="feelSub"><sup>o</sup><sup>C</sup></div>
</div>
</div>
<div class="two">
<div class="img"><img alt=""  src="img/icon.png"></div>
<div class="date">
<div class="dateIcon"><i class="fa-solid fa-calendar-days"></i></div>
<div class="dateDay">00/00/0000</div>

</div>

<div class="time">
<div class="timeIcon"><i class="fa-solid fa-clock"></i></div>
<div class="tme">00:00 </div>

</div>
</div>

</div>


<div class="three1">
<div class="one">
<div class="icon"><i class="fa-solid fa-temperature-half"></i></div>
<div class="Name">Temperature</div>
<div class="tempra"></div>
</div>
<div class="tow">
<div class="icon"><i class="fa-solid fa-droplet"></i></div>
<div class="name">Humidity</div>
<div class="humidity"></div>
</div>

<div class="three">
<div class="icon"><i class="fa-solid fa-wind"></i></div>
<div class="name">Wind Speed</div>
<div class="windSpeed"></div>
</div>
<div class="four">
<div class="icon"><i class="fa-solid fa-eye"></i></div>
<div class="name">Visibility</div>
<div class="visibility"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="app.js"></script>
</body>
</html>
